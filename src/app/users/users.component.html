<form action="" [formGroup]="userForm">
    <label for="">Name:</label>
    <input type="text" id="name" name="name" formControlName="name" appCapital><br>
    <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched">
        <p *ngIf="userForm.get('name')?.errors?.['required']">Name is required</p>
    </div>

    <label for="">Email:</label>
    <input type="email" id="email" name="email" formControlName="email"><br>
    <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
            <p *ngIf="userForm.get('email')?.errors?.['required']">Email is requried</p>
            <p *ngIf="userForm.get('email')?.errors?.['email']">Email is Invalid</p>
            <p *ngIf="userForm.get('email')?.errors?.['tcsMail']"> only TCS mail is accepted</p>
    </div>

    <label for="">Password:</label>
    <input type="password" id="password" name="password" formControlName="password"><br>
        <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
         <p *ngIf="userForm.get('password')?.errors?.['required']">Password is requried</p>
        <!-- <p *ngIf="userForm.get('password')?.errors?.['minlength']">Password must be minimum 6 letters</p> --> 
        <p *ngIf="userForm.get('password')?.errors?.['passwordValidator']"><small>password  must contain special chatecter and minimum 8 charecters and uppercase letter</small></p>
    </div>

    <label for="">Mobile:</label>
    <input type="mobile" id="mobile" name="mobile" formControlName="mobile"><br>
    <div *ngIf="userForm.get('mobile')?.invalid && userForm.get('mobile')?.touched">
        <p *ngIf="userForm.get('mobile')?.errors?.['required']">mobile is requried</p>
        <p *ngIf="userForm.get('mobile')?.errors?.['min']">minimum is 10 digits</p>
        <p *ngIf="userForm.get('mobile')?.errors?.['max']">maximum is 10 digits</p>

    </div>

    <div formGroupName="adress">
        <label for="">village</label>
        <input type="text" formControlName="village"><br>

        <label for="">district</label>
        <input type="text" formControlName="district"><br>

        <label for="">state</label>
        <input type="text" formControlName="state"><br>

        <label for="">pincode</label>
        <input type="pincode" formControlName="pincode"><br>
    </div>

    <label for="">Type:</label>
    <input type="radio" name="type" formControlName="type" value="dayscholar">
    <label for="">Dayscholar</label>
    <input type="radio" name="type" formControlName="type" value="hostel">
    <label for="">hostel</label><br>

    <div *ngIf="userForm.get('type')?.value=='dayscholar'">
        <label for="">Buss Fee:</label>
        <input type="number" formControlName="bussfee"><br>
    </div>

    <div *ngIf="userForm.get('type')?.value=='hostel'">
        <label for="">Hostel Fee:</label>
        <input type="number" formControlName="hostelfee"><br>
    </div>

    <button (click)="addCard()">Add Card</button>
    <div formArrayName="cards">
        <div *ngFor="let card of cardFormArray.controls; let i=index">
            <div formGroupName="{{i}}">
                <h1>card{{i+1}}</h1>
                <label for="">Number:</label>
                <input type="number" formContrlName="number"><br>
                <label for="">Expiry:</label>
                <input type="month" formContrlName="expiry"><br>
                <label for="">cvv:</label>
                <input type="number" formContrlName="cvv"><br>
                <button (click)="delete(i)">Delete Card</button>
            </div>
        </div>
    </div>

    <button class="btn btn-primary" (click)="create()">Submit</button>
</form>
